<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f5f7" />
    <title>页面走丢了 · Kimi</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC",
          "Hiragino Sans GB", "Microsoft YaHei", Arial, sans-serif;
        background: #f5f5f7;
        color: #1d1d1f;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 24px;
        -webkit-font-smoothing: antialiased;
      }
      .wrap { text-align: center; max-width: 420px; }
      .mark {
        font-family: "Instrument Serif", "SF Pro Display", serif;
        font-size: 96px;
        font-weight: 400;
        line-height: 1;
        letter-spacing: -0.02em;
        color: #000;
        opacity: 0.1;
        margin-bottom: 8px;
        animation: float-k 8s ease-in-out infinite;
        will-change: transform;
      }
      @keyframes float-k {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-14px); }
      }
      .code {
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        color: #86868b;
        margin-bottom: 10px;
      }
      h1 {
        font-size: 26px;
        font-weight: 600;
        letter-spacing: -0.01em;
        margin-bottom: 10px;
      }
      p {
        font-size: 15px;
        line-height: 1.6;
        color: #6e6e73;
        margin-bottom: 28px;
      }
      a.btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background: #000;
        color: #fff;
        text-decoration: none;
        font-size: 14px;
        font-weight: 500;
        padding: 12px 26px;
        border-radius: 9999px;
        transition: background 0.3s ease, transform 0.2s ease;
      }
      a.btn:hover { background: #1d1d1f; }
      a.btn:active { transform: scale(0.97); }
      .sig {
        margin-top: 36px;
        font-size: 11px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: #a1a1a6;
      }
      @media (prefers-reduced-motion: reduce) {
        .mark { animation: none; }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="mark">K</div>
      <div class="code">404</div>
      <h1>这个页面走丢了</h1>
      <p>你访问的链接可能已失效，或从未存在。<br />回到首页，继续逛逛吧。</p>
      <a class="btn" href="/">返回首页</a>
      <div class="sig">Kimi · 陈权峰</div>
    </div>
  </body>
</html>
